name: Build and deploy

# Site of the selo network (engine: github.com/kstein78/selo as a submodule in themes/selo).
# Every push to main: build + SEO check here; the Hetzner server (engine: hosting/) builds and serves
# the real domain by itself within a minute, and the "live" job checks that it did.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.139.4
  PAGEFIND_VERSION: 1.5.2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Install Hugo (extended)
        run: |
          wget -q -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - name: Serbian Cyrillic from the Latin text
        run: python3 themes/selo/scripts/sr_cyrl.py
      - name: Build site
        run: hugo --gc --minify
      - name: SEO check
        run: python3 themes/selo/scripts/seo_check.py public

  # The live site is served by the shared Hetzner server (engine: hosting/). It checks GitHub every
  # minute and rebuilds by itself; this job only confirms that ${{ vars.DOMAIN }} serves this commit.
  # Until the domain points at the server it just notes that and passes.
  live:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Wait until ${{ vars.DOMAIN }} serves this commit
        run: |
          url=https://${{ vars.DOMAIN }}/version.txt
          get() { curl -fsS --max-time 15 "$url?t=$(date +%s%N)" 2>/dev/null | head -1 || true; }
          live=$(get)
          if ! printf '%s' "$live" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::notice::${{ vars.DOMAIN }} does not serve version.txt yet (DNS or server not ready). Nothing to check."
            exit 0
          fi
          for i in $(seq 1 40); do
            git fetch -q origin main
            if git merge-base --is-ancestor "$GITHUB_SHA" "$live" 2>/dev/null; then
              echo "${{ vars.DOMAIN }} is live with $live (includes $GITHUB_SHA)"
              exit 0
            fi
            sleep 15
            live=$(get)
          done
          echo "::error::after 10 minutes ${{ vars.DOMAIN }} still serves $live, not $GITHUB_SHA. On the server: journalctl -u selo-update"
          exit 1
